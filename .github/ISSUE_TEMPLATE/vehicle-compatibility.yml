name: Vehicle compatibility report
description: Report a real, authorised OBD-II read test without disclosing private identifiers.
title: "[Vehicle Test] "
body:
  - type: markdown
    attributes:
      value: |
        Only test vehicles you own or have explicit permission to inspect. **Never publish full VINs, registration plates, API keys, MAC addresses or customer information.** No ECU writes exist in this beta.
  - type: input
    id: vehicle
    attributes:
      label: Make, model and year
      placeholder: "Toyota Corolla 2018"
    validations:
      required: true
  - type: input
    id: engine
    attributes:
      label: Engine / fuel type (optional)
      placeholder: "2.0 petrol"
  - type: input
    id: adapter
    attributes:
      label: Exact adapter and firmware
      placeholder: "ELM327 Bluetooth Classic SPP, maker/firmware"
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: What worked?
      options:
        - "Connected and read standard DTCs"
        - "Connected and read live PIDs"
        - "Connected but reads failed"
        - "Could not connect"
        - "Offline simulator only (not a vehicle test)"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Observed steps and sanitised output
      description: "Include error text, ignition state, supported PID count and non-identifying logs only."
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and safety confirmation
      options:
        - label: "I have removed all VIN, plate, MAC, API key and customer identifiers."
          required: true
        - label: "I did not perform ECU coding, flashing or active safety-system tests using this app."
          required: true
