name: Capture genuine Android launcher screenshot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-store-screenshot.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  emulator-screenshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build real Android debug app
        working-directory: .
        run: ./gradlew --no-daemon :app:assembleDebug --stacktrace
      - name: Reduce disk usage before emulator startup
        run: |
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -d "$sdk_root/ndk" ]; then sudo rm -rf "$sdk_root/ndk"; fi
          if [ -d "$sdk_root/cmake" ]; then sudo rm -rf "$sdk_root/cmake"; fi
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Capture actual app view on a clean Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disk-size: 2048M
          ram-size: 2048M
          disable-animations: true
          script: |
            set -eu
            mkdir -p fastlane/metadata/android/en-US/images/phoneScreenshots
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.dan.bmwforgex -c android.intent.category.LAUNCHER 1
            sleep 6
            adb shell pidof 'com.dan.bmwforgex' >/dev/null
            adb exec-out screencap -p > fastlane/metadata/android/en-US/images/phoneScreenshots/01-home.png
            test -s fastlane/metadata/android/en-US/images/phoneScreenshots/01-home.png
      - name: Upload original emulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: genuine-android-store-screenshot
          path: fastlane/metadata/android/en-US/images/phoneScreenshots/01-home.png
          if-no-files-found: error
      - name: Preserve unedited screenshot in Fastlane metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fastlane/metadata/android/en-US/images/phoneScreenshots/01-home.png
          if ! git diff --cached --quiet; then
            git commit -m 'docs: capture genuine Android UI screenshot [skip ci]'
            git push origin HEAD:main
          fi
