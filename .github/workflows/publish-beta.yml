name: Publish Android beta APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-beta.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vehicle-forge-x-beta-release
  cancel-in-progress: false

jobs:
  publish:
    name: Test, build and publish v0.3.0-beta.2
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Get official Kotlin compiler for standalone smoke tests
        run: |
          curl --fail --location --retry 3 -o kotlin.zip \
            https://github.com/JetBrains/kotlin/releases/download/v2.3.21/kotlin-compiler-2.3.21.zip
          unzip -q kotlin.zip -d "$RUNNER_TEMP/kotlin-cli"
          echo "$RUNNER_TEMP/kotlin-cli/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Run protocol, offline coding and diagnostics smoke tests
        run: ./TEST_CORE.sh
      - name: Install Android API 37
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Android JUnit tests and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug --stacktrace
      - name: Create direct-install beta files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/vehicle-forge-x-beta.apk
          ( cd dist && sha256sum vehicle-forge-x-beta.apk > SHA256SUMS.txt )
          test -s dist/vehicle-forge-x-beta.apk
          test -s dist/SHA256SUMS.txt
      - name: Upload debug artifact for audit
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-forge-x-v0.3.0-beta.2
          path: dist/
      - name: Publish public GitHub prerelease (direct APK)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="v0.3.0-beta.2"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists. Refusing to overwrite published binaries."
            exit 1
          fi
          gh release create "$VERSION" \
            dist/vehicle-forge-x-beta.apk \
            dist/SHA256SUMS.txt \
            --title "Vehicle Forge X v0.3.0 Beta (diagnostics only)" \
            --notes "Experimental Android diagnostic APK. Generic OBD-II read functions and offline multi-brand coding plans only. **No vehicle coding or ECU write capability.** Built and unit-tested on GitHub Actions; actual vehicle adapter testing is still required. This APK uses an ephemeral GitHub runner debug certificate, so upgrades may require uninstall and reinstallation with loss of app-local state. Use a parked, authorised vehicle and read the README before connecting." \
            --prerelease --target "$GITHUB_SHA"
