name: Vehicle Forge X Android and protocol checks

on:
  push:
    paths:
      - 'app/**'
      - '*.kt'
      - '*.sh'
      - '*.kts'
      - '.github/workflows/verify.yml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: vehicle-forge-x-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  protocol-core:
    name: Protocol JVM smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install official Kotlin CLI compiler
        run: |
          curl --fail --location --retry 3 -o kotlin.zip \
            https://github.com/JetBrains/kotlin/releases/download/v2.3.21/kotlin-compiler-2.3.21.zip
          unzip -q kotlin.zip -d "$RUNNER_TEMP/kotlin-cli"
          echo "$RUNNER_TEMP/kotlin-cli/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Validate release helper shell syntax
        run: bash -n scripts/setup-release-signing.sh scripts/backup-and-verify-signing-keys.sh scripts/download-verify-signed-candidates.sh
      - name: Execute isolated protocol tests
        run: ./TEST_CORE.sh

  android-debug:
    name: Android debug build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Ubuntu runners already include the Android SDK command-line manager.
      # setup-android@v3 currently calls the removed legacy "tools" package.
      - name: Install Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Android tests and build
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Calculate install artifact SHA-256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-forge-x-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
