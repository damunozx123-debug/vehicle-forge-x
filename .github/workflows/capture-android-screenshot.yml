name: Capture native Android emulator screenshot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-android-screenshot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
      - name: Install Android compile platform
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
      - name: Build real native debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Capture clean install using headless Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            mkdir -p docs/screenshots
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p com.dan.bmwforgex -c android.intent.category.LAUNCHER 1
            sleep 5
            adb exec-out screencap -p > docs/screenshots/android-first-run.png
            test -s docs/screenshots/android-first-run.png
      - uses: actions/upload-artifact@v4
        with:
          name: android-ui-screenshot
          path: docs/screenshots/android-first-run.png
          if-no-files-found: error
          retention-days: 30
      - name: Commit verified emulator screenshot
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/android-first-run.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: capture native Android emulator first run [skip ci]"
            git push origin HEAD:main
          fi
