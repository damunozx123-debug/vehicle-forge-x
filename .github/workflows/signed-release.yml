name: Publish verified signed Android APK
on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Tag must match Android versionName, prefixed v (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: signed-android-release
  cancel-in-progress: false

jobs:
  signed-release:
    # Manual dispatch from the trusted default branch only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.version_tag }}
      KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
      STOREPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fail closed if signing secrets or trusted release tag missing
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]] || { echo "Invalid version_tag"; exit 1; }
          for item in KEYSTORE_B64 STOREPASS KEYPASS KEYALIAS; do
            [[ -n "${!item}" ]] || { echo "Missing required secret: $item"; exit 1; }
          done
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Refusing to overwrite an existing signed release."
            exit 1
          fi
      - name: Install required Android SDK and signing tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Test and assemble unsigned release
        shell: bash
        working-directory: .
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease --stacktrace
      - name: Zipalign, sign, verify and package
        shell: bash
        run: |
          set -euo pipefail
          BT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/36.0.0"
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK" || { echo "Unsigned release artifact missing"; exit 1; }
          install -d -m 700 "$RUNNER_TEMP/android-sign" dist
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/android-sign/signing.p12"
          chmod 600 "$RUNNER_TEMP/android-sign/signing.p12"
          "$BT/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/android-sign/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/android-sign/signing.p12" \
            --ks-key-alias "$KEYALIAS" \
            --ks-pass env:STOREPASS --key-pass env:KEYPASS \
            --out "dist/vehicle-forge.apk" "$RUNNER_TEMP/android-sign/aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs "dist/vehicle-forge.apk"
          "$BT/zipalign" -c -v 4 "dist/vehicle-forge.apk"
          PACKAGE="$("$BT/aapt" dump badging "dist/vehicle-forge.apk" | grep '^package:')"
          echo "$PACKAGE"
          [[ "$PACKAGE" == *"name='com.dan.bmwforgex'"* ]] || { echo 'Wrong package ID'; exit 1; }
          [[ "$PACKAGE" == *"versionName='${TAG#v}'"* ]] || { echo 'Version tag does not match APK'; exit 1; }
          (cd dist && sha256sum 'vehicle-forge.apk' > SHA256SUMS.txt)
          rm -f "$RUNNER_TEMP/android-sign/signing.p12"
      - name: Publish immutable signed release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" 'dist/vehicle-forge.apk' dist/SHA256SUMS.txt \
            --repo "$GH_REPO" --target "$GITHUB_SHA" \
            --title "Vehicle Forge $TAG" \
            --notes "Developer-signed Android APK built from this tagged source commit. Verify the APK signing certificate and SHA256 before deploying to an F-Droid-compatible index. Source and software limitations are documented in the repository."
          echo "Signed artifact published: $TAG" >> "$GITHUB_STEP_SUMMARY"
